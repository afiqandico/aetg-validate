[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetg-validate"
version = "0.2.0"
description = "Phi-gated IDS/ML-NIDS evasion validation with Wilson confidence intervals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Afiq Andico Pangimpian", email = "afiqandico13@gmail.com" }]
keywords = ["ids", "suricata", "evasion", "security-control-validation", "ml-nids", "adversarial-ml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/afiqandico/aetg-validate"
Issues = "https://github.com/afiqandico/aetg-validate/issues"

[project.scripts]
aetg-validate = "aetg_validate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
