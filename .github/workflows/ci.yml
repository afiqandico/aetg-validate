name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Demo end-to-end
        run: |
          aetg-validate demo --out /tmp/demo
          test -f /tmp/demo/scan.json
          test -f /tmp/demo/report.md
          test -f /tmp/demo/report.html

      - name: Digest re-verification
        run: aetg-validate report --scan /tmp/demo/scan.json --out /tmp/verify

      - name: Measurement digest is reproducible across runs
        run: |
          aetg-validate demo --out /tmp/demo2 >/dev/null
          python - <<'PY'
          import json
          a = json.load(open("/tmp/demo/scan.json"))["integrity"]["measurement_digest"]
          b = json.load(open("/tmp/demo2/scan.json"))["integrity"]["measurement_digest"]
          print("run1:", a)
          print("run2:", b)
          assert a == b, "measurement digest is not reproducible"
          print("OK: reproducible")
          PY

      - name: Scan a pcap end to end (no docker)
        run: |
          python examples/make_sample_capture.py --out /tmp/sample >/dev/null
          cat > /tmp/eve.json <<'JSON'
          {"event_type":"alert","src_ip":"10.0.0.5","src_port":40001,"dest_ip":"10.0.0.9","dest_port":22,"proto":"TCP","alert":{"signature_id":1000001,"signature":"AETG sample: SSH connection attempt"}}
          JSON
          aetg-validate scan --pcap /tmp/sample/sample.pcap --eve-json /tmp/eve.json --out /tmp/scan
          python - <<'PY'
          import json
          s = json.load(open("/tmp/scan/scan.json"))["summary"]
          phi, raw = s["esr_phi_pct"], s["esr_feature_space_pct"]
          assert (phi["k"], phi["n"]) == (1, 2), phi
          assert (raw["k"], raw["n"]) == (2, 3), raw
          assert s["population"]["n_gate_rejected"] == 1
          assert open("/tmp/scan/report.pdf", "rb").read(8) == b"%PDF-1.4"
          print("OK: Phi 50.00% (1/2) vs naive 66.67% (2/3), 1 flow gate-rejected")
          PY

      - name: Tamper detection must fail
        run: |
          python - <<'PY'
          import json
          p = "/tmp/demo/scan.json"
          d = json.load(open(p))
          d["summary"]["esr_phi"]["point"] = 0.0
          d["summary"]["esr_phi"]["k"] = 0
          json.dump(d, open("/tmp/forged.json", "w"))
          PY
          if aetg-validate report --scan /tmp/forged.json --out /tmp/forged; then
            echo "FAIL: tampered report passed integrity check"; exit 1
          fi
          echo "OK: tampered report rejected"
